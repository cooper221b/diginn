<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diginn Recipe Customizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f8f8;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1::after {
            content: '';
            display: block;
            width: 100px;
            height: 3px;
            background-color: #d32f2f;
            margin: 15px auto;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 0;
            margin-bottom: 40px;
            border-bottom: 2px solid #e0e0e0;
        }

        .nav-tab {
            padding: 15px 40px;
            border: none;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            margin-bottom: -2px;
        }

        .nav-tab:hover {
            color: #2d2d2d;
        }

        .nav-tab.active {
            color: #d32f2f;
            border-bottom-color: #d32f2f;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 25px;
            background-color: #e8d5d5;
            color: #333;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background-color: #d5b8b8;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background-color: #2d2d2d;
            color: white;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .recipe-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .recipe-image {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .recipe-content {
            padding: 20px;
        }

        .recipe-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2d2d2d;
        }

        .recipe-description {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .recipe-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #999;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .recipe-category {
            display: inline-block;
            padding: 4px 12px;
            background-color: #f0f0f0;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
            position: relative;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #2d2d2d;
        }

        .modal-subtitle {
            color: #666;
            font-size: 0.95rem;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 35px;
            height: 35px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #e0e0e0;
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
        }

        .quantity-control {
            background: #f8f8f8;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
        }

        .quantity-control label {
            display: block;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #2d2d2d;
        }

        .quantity-input {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .qty-btn {
            width: 45px;
            height: 45px;
            border: none;
            background: #2d2d2d;
            color: white;
            font-size: 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .qty-btn:hover {
            background: #444;
            transform: scale(1.1);
        }

        .qty-display {
            font-size: 2rem;
            font-weight: 600;
            min-width: 150px;
            color: #2d2d2d;
        }

        .ingredients-section, .instructions-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2d2d2d;
            padding-bottom: 10px;
            border-bottom: 2px solid #d32f2f;
        }

        .ingredient-list {
            list-style: none;
        }

        .ingredient-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
        }

        .ingredient-item:last-child {
            border-bottom: none;
        }

        .ingredient-name {
            color: #2d2d2d;
            font-weight: 500;
        }

        .ingredient-amount {
            color: #666;
            font-weight: 600;
        }

        .instructions-list {
            counter-reset: step-counter;
            list-style: none;
        }

        .instruction-step {
            counter-increment: step-counter;
            padding: 15px 0 15px 50px;
            position: relative;
            line-height: 1.7;
            font-size: 1rem;
            color: #444;
        }

        .instruction-step::before {
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: 15px;
            width: 35px;
            height: 35px;
            background: #2d2d2d;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .marinade-note {
            background: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #ff9800;
        }

        .marinade-note strong {
            color: #e65100;
        }

        /* Meal Planning Styles */
        .meal-plan-list {
            max-width: 900px;
            margin: 0 auto 40px;
        }

        .meal-item {
            background: white;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .meal-info {
            flex: 1;
            min-width: 0;
        }

        .meal-name {
            font-size: 1rem;
            font-weight: 600;
            color: #2d2d2d;
            margin-bottom: 2px;
        }

        .meal-category {
            font-size: 0.8rem;
            color: #999;
            text-transform: capitalize;
        }

        .meal-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meal-qty-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #e0e0e0;
            background: white;
            color: #2d2d2d;
            font-size: 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .meal-qty-btn:hover {
            background: #f5f5f5;
            border-color: #d32f2f;
            color: #d32f2f;
        }

        .meal-qty-btn:active {
            transform: scale(0.95);
        }

        .meal-qty-display {
            min-width: 40px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: #2d2d2d;
        }

        .shopping-list-container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .shopping-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .shopping-list-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #2d2d2d;
        }

        .copy-btn {
            padding: 10px 20px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .copy-btn:hover {
            background: #b71c1c;
        }

        .copy-btn.copied {
            background: #4caf50;
        }

        .shopping-list {
            list-style: none;
        }

        .shopping-category {
            margin-bottom: 20px;
        }

        .shopping-category-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d2d2d;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #e0e0e0;
        }

        .shopping-item {
            padding: 8px 0;
            color: #444;
            font-size: 1rem;
            display: flex;
            gap: 10px;
        }

        .shopping-item::before {
            content: '•';
            color: #d32f2f;
            font-weight: bold;
        }

        .empty-message {
            text-align: center;
            color: #999;
            font-size: 1.1rem;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .recipe-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .modal-content {
                margin: 20px auto;
            }

            .qty-display {
                font-size: 1.5rem;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Recipe Customizer</h1>
        </header>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('browse')">Browse Recipes</button>
            <button class="nav-tab" onclick="switchTab('plan')">Meal Planning</button>
        </div>

        <!-- Browse Recipes Section -->
        <div id="browseSection" class="section active">
            <div class="filters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="proteins">Proteins</button>
                <button class="filter-btn" data-category="vegetables">Vegetables</button>
                <button class="filter-btn" data-category="bases">Bases</button>
                <button class="filter-btn" data-category="sauces">Sauces</button>
            </div>

            <div class="recipe-grid" id="recipeGrid"></div>
        </div>

        <!-- Meal Planning Section -->
        <div id="planSection" class="section">
            <div class="meal-plan-list" id="mealPlanList"></div>

            <div class="shopping-list-container">
                <div class="shopping-list-header">
                    <h2 class="shopping-list-title">Shopping List</h2>
                    <button class="copy-btn" onclick="copyShoppingList()">Copy to Clipboard</button>
                </div>
                <div id="shoppingListContent"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="recipeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-subtitle" id="modalSubtitle"></p>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="quantity-control">
                    <label>Adjust Servings</label>
                    <div class="quantity-input">
                        <button class="qty-btn" onclick="decreaseQuantity()">−</button>
                        <div class="qty-display" id="qtyDisplay"></div>
                        <button class="qty-btn" onclick="increaseQuantity()">+</button>
                    </div>
                </div>

                <div id="marinadeNote"></div>

                <div class="ingredients-section">
                    <h3 class="section-title">Ingredients</h3>
                    <ul class="ingredient-list" id="ingredientList"></ul>
                </div>

                <div class="instructions-section">
                    <h3 class="section-title">Instructions</h3>
                    <ol class="instructions-list" id="instructionsList"></ol>
                </div>
            </div>
        </div>
    </div>

    <script>
        const recipes = [
            {
                id: 1,
                name: "Charred Chicken Thighs",
                category: "proteins",
                description: "Perfectly seared boneless chicken thighs with a crispy exterior and juicy interior, finished in the oven",
                imageKeywords: "grilled-chicken-thighs",
                baseServings: 4,
                ingredients: [
                    { name: "boneless, skinless chicken thighs", amount: 2, unit: "lb", scalable: true },
                    { name: "olive oil", amount: 1, unit: "tbsp", scalable: true },
                    { name: "kosher salt", amount: 1, unit: "tsp", scalable: true },
                    { name: "black pepper", amount: 0.5, unit: "tsp", scalable: true },
                    { name: "garlic powder", amount: 1, unit: "tsp", scalable: true }
                ],
                instructions: [
                    "Pat chicken thighs dry with paper towels",
                    "Toss with oil, salt, pepper, and garlic powder until evenly coated",
                    "Heat cast-iron skillet over high heat until very hot",
                    "Sear chicken 3-4 minutes per side until deep golden brown",
                    "Transfer skillet to preheated 400°F oven",
                    "Cook 6-8 minutes until internal temperature reaches 165°F",
                    "Rest 5 minutes before slicing"
                ],
                marinadeTime: null
            },
            {
                id: 2,
                name: "Honey Sriracha Glazed Chicken Thighs",
                category: "proteins",
                description: "Sweet and spicy glazed chicken with caramelized edges and bold Asian-inspired flavors",
                imageKeywords: "asian-glazed-chicken",
                baseServings: 4,
                ingredients: [
                    { name: "boneless, skinless chicken thighs", amount: 2, unit: "lb", scalable: true },
                    { name: "honey", amount: 6, unit: "tbsp", scalable: true },
                    { name: "sriracha", amount: 3, unit: "tbsp", scalable: true },
                    { name: "soy sauce", amount: 1, unit: "tbsp", scalable: true },
                    { name: "rice or apple cider vinegar", amount: 1, unit: "tbsp", scalable: true },
                    { name: "minced garlic", amount: 1, unit: "tsp", scalable: true },
                    { name: "smoked paprika", amount: 0.5, unit: "tsp", scalable: true },
                    { name: "salt", amount: 0.25, unit: "tsp", scalable: true }
                ],
                instructions: [
                    "Whisk together honey, sriracha, soy sauce, vinegar, garlic, paprika, and salt",

                    "Marinate chicken thighs in remaining sauce for 30-240 minutes",
                    "Heat skillet over medium-high heat",
                    "Sear marinated chicken 3 minutes per side",
                    "Brush with reserved sauce",
                    "Transfer to 400°F oven and cook 6-8 minutes until 165°F internal",
                    "Optional: broil 1 minute to caramelize glaze",

            {
                id: 3,

                    { name: "honey", amount: 1, unit: "tbsp", scalable: true },
                    { name: "soy sauce", amount: 1, unit: "tbsp", scalable: true },
                    { name: "lime juice", amount: 1, unit: "tsp", scalable: true },
                    { name: "sesame oil", amount: 1, unit: "tsp", scalable: true },
                    { name: "garlic clove, minced", amount: 1, unit: "clove", scalable: true }
                ],
                instructions: [
                    "Whisk together honey, soy sauce, lime juice, sesame oil, and garlic",
                    "Season beef with salt and pepper, then add to marinade",
                    "Marinate 30-120 minutes in refrigerator",
                    "Heat oven to 425°F",
                    "Heat oven-safe skillet over high heat",
                    "Sear beef 2 minutes per side until deep brown crust forms",
                    "Transfer to oven and roast 6-8 minutes for medium-rare",
                    "Remove and rest 10 minutes",
                    "Slice thin against the grain before serving"
                ],
                marinadeTime: "30-120 minutes"
            },
            {
                id: 4,
                name: "Charred Broccoli with Lemon",

                    { name: "broccoli florets", amount: 1.5, unit: "lb", scalable: true },

                    { name: "lemon juice", amount: 1, unit: "tbsp", scalable: true },
                    { name: "soy sauce", amount: 1, unit: "tsp", scalable: true },
                    { name: "chili flakes", amount: 0.125, unit: "tsp", scalable: true }
                ],
                instructions: [
                    "Preheat oven to 425°F",

                    "Transfer hot broccoli to serving bowl",
                    "Toss with lemon juice, soy sauce, and chili flakes",

                marinadeTime: null

            {

                    "Serve immediately"

                marinadeTime: null

            {
                id: 6,
                name: "Sheet-Tray Carrots",

                    { name: "honey", amount: 0.5, unit: "tsp", scalable: true },
                    { name: "ground coriander", amount: 0.5, unit: "tsp", scalable: true },
                    { name: "ground cumin", amount: 0.25, unit: "tsp", scalable: true },
                    { name: "kosher salt", amount: 0.5, unit: "tsp", scalable: true },

                instructions: [

                    "Cut carrots into ½-inch coins or batons",

                    "Roast 18-22 minutes until lightly charred and tender",

                marinadeTime: null
            },
            {
                id: 7,
                name: "Cashew Kale Caesar",

                    { name: "cashew butter", amount: 3, unit: "tbsp", scalable: true },
                    { name: "lemon juice", amount: 2, unit: "tbsp", scalable: true },
                    { name: "honey", amount: 1, unit: "tbsp", scalable: true },
                    { name: "olive oil", amount: 1, unit: "tbsp", scalable: true },
                    { name: "garlic clove, grated", amount: 1, unit: "clove", scalable: true },
                    { name: "Dijon mustard", amount: 0.5, unit: "tsp", scalable: true },
                    { name: "salt", amount: 0.375, unit: "tsp", scalable: true },
                    { name: "water to thin", amount: 2.5, unit: "tbsp", scalable: true },
                    { name: "coarse breadcrumbs", amount: 0.5, unit: "cup", scalable: true }
                ],
                instructions: [

        let currentRecipe = null;
        let currentServings = 4;
        let mealPlan = {}; // Store servings for each recipe: { recipeId: servings }

        // Pantry items to exclude from shopping list
        const pantryItems = [
            'salt', 'kosher salt', 'black pepper', 'pepper', 'olive oil',
            'water', 'garlic powder', 'chili flakes'
        ];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderRecipes('all');
            setupFilters();
            renderMealPlanList();
        });

        function setupFilters() {
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const category = btn.dataset.category;
                    renderRecipes(category);
                });
            });
        }

        function renderRecipes(category) {
            const grid = document.getElementById('recipeGrid');
            const filteredRecipes = category === 'all'
                ? recipes
                : recipes.filter(r => r.category === category);

            grid.innerHTML = filteredRecipes.map(recipe => {
                const encodedName = encodeURIComponent(recipe.name);
                return `
                <div class="recipe-card" onclick="openRecipe(${recipe.id})">
                    <div class="recipe-image">
                        <img src="https://via.placeholder.com/400x300/d32f2f/ffffff?text=${encodedName}"
                             alt="${recipe.name}"
                             loading="lazy"
                             style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div class="recipe-content">
                        <h3 class="recipe-title">${recipe.name}</h3>
                        <p class="recipe-description">${recipe.description}</p>
                        <div class="recipe-meta">
                            <span class="recipe-category">${recipe.category}</span>
                            <span>${recipe.baseServings} servings</span>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }

        function openRecipe(recipeId) {
            currentRecipe = recipes.find(r => r.id === recipeId);
            currentServings = currentRecipe.baseServings;

            document.getElementById('modalTitle').textContent = currentRecipe.name;
            document.getElementById('modalSubtitle').textContent = currentRecipe.description;

            updateRecipeDisplay();
            document.getElementById('recipeModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.remove('active');
        }

        function increaseQuantity() {
            currentServings++;
            updateRecipeDisplay();
        }

        function decreaseQuantity() {
            if (currentServings > 1) {
                currentServings--;
                updateRecipeDisplay();
            }
        }

        function updateRecipeDisplay() {
            const scaleFactor = currentServings / currentRecipe.baseServings;

            // Update servings display
            document.getElementById('qtyDisplay').textContent = `${currentServings} servings`;

            // Show marinade note if applicable
            const marinadeNote = document.getElementById('marinadeNote');
            if (currentRecipe.marinadeTime) {
                marinadeNote.innerHTML = `
                    <div class="marinade-note">
                        <strong>Marinade Time:</strong> ${currentRecipe.marinadeTime}
                    </div>
                `;
            } else {
                marinadeNote.innerHTML = '';
            }

            // Update ingredients
            const ingredientList = document.getElementById('ingredientList');
            ingredientList.innerHTML = currentRecipe.ingredients.map(ing => {
                const scaledAmount = ing.scalable ? (ing.amount * scaleFactor) : ing.amount;
                const formattedAmount = formatAmount(scaledAmount);

                return `
                    <li class="ingredient-item">
                        <span class="ingredient-name">${ing.name}</span>
                        <span class="ingredient-amount">${formattedAmount} ${ing.unit}</span>
                    </li>
                `;
            }).join('');

            // Update instructions
            const instructionsList = document.getElementById('instructionsList');
            instructionsList.innerHTML = currentRecipe.instructions.map(step => `
                <li class="instruction-step">${step}</li>
            `).join('');
        }

        function formatAmount(amount) {
            // Handle common fractions
            const fraction = amount - Math.floor(amount);
            const whole = Math.floor(amount);

            const fractions = {
                0.125: '⅛',
                0.25: '¼',
                0.333: '⅓',
                0.375: '⅜',
                0.5: '½',
                0.625: '⅝',
                0.666: '⅔',
                0.75: '¾',
                0.875: '⅞'
            };

            // Find closest fraction
            let closestFraction = null;
            let minDiff = 0.05;

            for (let [dec, frac] of Object.entries(fractions)) {
                const diff = Math.abs(fraction - parseFloat(dec));
                if (diff < minDiff) {
                    minDiff = diff;
                    closestFraction = frac;
                }
            }

            if (closestFraction && minDiff < 0.03) {
                return whole > 0 ? `${whole} ${closestFraction}` : closestFraction;
            }

            // Round to 2 decimal places for non-fractional amounts
            return amount % 1 === 0 ? amount.toString() : amount.toFixed(2);
        }

        // Close modal on outside click
        document.getElementById('recipeModal').addEventListener('click', (e) => {
            if (e.target.id === 'recipeModal') {
                closeModal();
            }
        });

        // Close modal on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Meal Planning Functions
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.nav-tab');
            const sections = document.querySelectorAll('.section');

            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));

            if (tab === 'browse') {
                tabs[0].classList.add('active');
                document.getElementById('browseSection').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('planSection').classList.add('active');
            }
        }

        function renderMealPlanList() {
            const list = document.getElementById('mealPlanList');

            // Sort recipes by category order: proteins, vegetables, bases, sauces
            const categoryOrder = { proteins: 1, vegetables: 2, bases: 3, sauces: 4 };
            const sortedRecipes = [...recipes].sort((a, b) => {
                return categoryOrder[a.category] - categoryOrder[b.category];
            });

            list.innerHTML = sortedRecipes.map(recipe => `
                <div class="meal-item">
                    <div class="meal-info">
                        <div class="meal-name">${recipe.name}</div>
                        <div class="meal-category">${recipe.category}</div>
                    </div>
                    <div class="meal-selector">
                        <button class="meal-qty-btn" onclick="decrementMeal(${recipe.id})">−</button>
                        <div class="meal-qty-display">${mealPlan[recipe.id] || 0}</div>
                        <button class="meal-qty-btn" onclick="incrementMeal(${recipe.id})">+</button>
                    </div>
                </div>
            `).join('');

            generateShoppingList();
        }

        function incrementMeal(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            const currentServings = mealPlan[recipeId] || 0;
            updateMealPlan(recipeId, currentServings + recipe.baseServings);
        }

        function decrementMeal(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            const currentServings = mealPlan[recipeId] || 0;
            if (currentServings >= recipe.baseServings) {
                updateMealPlan(recipeId, currentServings - recipe.baseServings);
            }
        }

        function updateMealPlan(recipeId, servings) {
            servings = parseInt(servings) || 0;
            if (servings > 0) {
                mealPlan[recipeId] = servings;
            } else {
                delete mealPlan[recipeId];
            }
            generateShoppingList();
        }

        function generateShoppingList() {
            const aggregated = {};

            // Aggregate ingredients from all selected recipes
            Object.keys(mealPlan).forEach(recipeId => {
                const recipe = recipes.find(r => r.id === parseInt(recipeId));
                const servings = mealPlan[recipeId];
                const scaleFactor = servings / recipe.baseServings;

                recipe.ingredients.forEach(ing => {
                    // Skip pantry items
                    if (isPantryItem(ing.name)) {
                        return;
                    }

                    const key = normalizeIngredientName(ing.name);
                    const scaledAmount = ing.scalable ? (ing.amount * scaleFactor) : ing.amount;

                    if (aggregated[key]) {
                        aggregated[key].amount += scaledAmount;
                    } else {
                        aggregated[key] = {
                            name: ing.name,
                            amount: scaledAmount,
                            unit: ing.unit
                        };
                    }
                });
            });

            displayShoppingList(aggregated);
        }

        function normalizeIngredientName(name) {
            // Combine similar ingredients
            const normalized = name.toLowerCase().trim();

            // Group chicken
            if (normalized.includes('chicken thigh')) {
                return 'chicken_thighs';
            }
            if (normalized.includes('chicken')) {
                return 'chicken';
            }

            // Group beef
            if (normalized.includes('flank') || normalized.includes('sirloin') || normalized.includes('steak')) {
                return 'beef';
            }

            // Group similar vegetables
            if (normalized.includes('broccoli')) return 'broccoli';
            if (normalized.includes('sweet potato')) return 'sweet_potatoes';
            if (normalized.includes('carrot')) return 'carrots';
            if (normalized.includes('kale')) return 'kale';

            // Group similar bases
            if (normalized.includes('brown rice')) return 'brown_rice';
            if (normalized.includes('farro')) return 'farro';

            // Default: use the original name
            return normalized.replace(/[^a-z0-9]/g, '_');
        }

        function isPantryItem(name) {
            const normalized = name.toLowerCase();
            return pantryItems.some(item => normalized.includes(item));
        }

        function getIngredientCategory(ingredientName) {
            const name = ingredientName.toLowerCase();

            // Proteins
            if (name.includes('chicken') || name.includes('beef') || name.includes('steak') ||
                name.includes('flank') || name.includes('sirloin') || name.includes('thigh')) {
                return 'Proteins';
            }

            // Produce
            if (name.includes('broccoli') || name.includes('carrot') || name.includes('sweet potato') ||
                name.includes('kale') || name.includes('garlic') || name.includes('ginger') ||
                name.includes('lemon') || name.includes('lime')) {
                return 'Produce';
            }

            // Grains & Pantry
            if (name.includes('rice') || name.includes('farro') || name.includes('cashew') ||
                name.includes('breadcrumb')) {
                return 'Grains & Pantry';
            }

            // Condiments & Sauces
            if (name.includes('honey') || name.includes('sriracha') || name.includes('soy sauce') ||
                name.includes('vinegar') || name.includes('miso') || name.includes('mustard') ||
                name.includes('tahini')) {
                return 'Condiments & Sauces';
            }

            // Oils & Seasonings
            if (name.includes('oil') || name.includes('paprika') || name.includes('cumin') ||
                name.includes('coriander') || name.includes('sesame')) {
                return 'Oils & Seasonings';
            }

            return 'Other';
        }

        function displayShoppingList(aggregated) {
            const content = document.getElementById('shoppingListContent');
            const items = Object.values(aggregated);

            if (items.length === 0) {
                content.innerHTML = '<div class="empty-message">Select recipes above to generate your shopping list</div>';
                return;
            }

            // Group by ingredient type
            const byType = {
                'Proteins': [],
                'Produce': [],
                'Grains & Pantry': [],
                'Condiments & Sauces': [],
                'Oils & Seasonings': [],
                'Other': []
            };

            items.forEach(item => {
                const type = getIngredientCategory(item.name);
                byType[type].push(item);
            });

            let html = '<div class="shopping-list">';

            // Display categories in order
            ['Proteins', 'Produce', 'Grains & Pantry', 'Condiments & Sauces', 'Oils & Seasonings', 'Other'].forEach(type => {
                if (byType[type].length > 0) {
                    html += `
                        <div class="shopping-category">
                            <h3 class="shopping-category-title">${type}</h3>
                    `;

                    byType[type].forEach(item => {
                        const formattedAmount = formatAmount(item.amount);
                        html += `
                            <div class="shopping-item">
                                ${formattedAmount} ${item.unit} ${item.name}
                            </div>
                        `;
                    });

                    html += '</div>';
                }
            });

            html += '</div>';
            content.innerHTML = html;
        }

        function copyShoppingList() {
            const content = document.getElementById('shoppingListContent');
            const btn = document.querySelector('.copy-btn');

            // Extract text from the shopping list
            const categories = content.querySelectorAll('.shopping-category');
            let text = 'SHOPPING LIST\n\n';

            categories.forEach(cat => {
                const title = cat.querySelector('.shopping-category-title').textContent;
                const items = cat.querySelectorAll('.shopping-item');

                text += `${title.toUpperCase()}\n`;
                items.forEach(item => {
                    text += `• ${item.textContent.trim()}\n`;
                });
                text += '\n';
            });

            // Copy to clipboard
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy to Clipboard';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('Failed to copy. Please try selecting and copying manually.');
            });
        }
